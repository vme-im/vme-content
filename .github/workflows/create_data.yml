name: 创建数据

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  createData:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: actions_scripts/package-lock.json
      - name: 安装依赖
        run: |
          cd actions_scripts
          npm ci
      - name: 运行脚本
        run: |
          cd actions_scripts
          npx tsx src/createData.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: 刷新 jsDelivr 缓存
        # vme-app 生产走 jsDelivr CDN 拉 snapshot.sql，@main 默认 12h 缓存；
        # push 完主动 purge 一次，秒级生效。无 push 时打同 URL 也是幂等的
        if: always()
        run: |
          curl -sS -m 10 "https://purge.jsdelivr.net/gh/vme-im/vme-content@main/data/snapshot.sql" || true
