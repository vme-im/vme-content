name: 文案审核

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  moderate-issue:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && (github.event.label.name == '文案' || github.event.label.name == '梗图')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: actions_scripts/package-lock.json
      - name: 安装依赖
        run: |
          cd actions_scripts
          npm ci
      - name: 运行脚本
        run: |
          cd actions_scripts
          npx tsx src/moderateIssue.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
          SYNC_API_URL: ${{ vars.SYNC_API_URL }}
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
